# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# The repository's default branch is `main`. Pin Codecov to it explicitly so
# its default branch, project baseline, and cached YAML match the repo instead
# of a stale `master` value.
codecov:
  branch: main

# The test suite enforces >= 90% statement/branch/function/line coverage locally
# via `c8 --check-coverage` (`npm run test:coverage`). The status checks below
# gate the Codecov project and patch at the same threshold so that CI and
# Codecov agree, instead of relying on Codecov's implicit "auto" defaults.

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

ignore:
  - "test/**"
  - "coverage/**"
