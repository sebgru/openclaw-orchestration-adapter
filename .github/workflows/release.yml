name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Syntax check
        run: npm run check

      - name: Test with coverage (>= 90% enforced)
        run: npm run test:coverage

      - name: Build package tarball
        run: npm pack

      - name: Upload tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: openclaw-orchestration-adapter-*.tgz
          generate_release_notes: true
